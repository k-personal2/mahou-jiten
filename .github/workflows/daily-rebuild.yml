# 「今日の魔法」はビルド日で決まるため、毎日ビルドして Cloudflare Workers に再デプロイする
name: Daily rebuild

on:
  schedule:
    - cron: '5 15 * * *' # 毎日 00:05 JST
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Check secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN が未設定のためスキップ"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version-file: astro/.node-version
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - if: steps.check.outputs.skip != '1'
        run: npm ci && npm run build
      - if: steps.check.outputs.skip != '1'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
