# 「今日の魔法」はビルド日で決まるため、毎日 Cloudflare Pages を再ビルドする
name: Daily rebuild

on:
  schedule:
    - cron: '5 15 * * *' # 毎日 00:05 JST
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL が未設定のためスキップ"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
